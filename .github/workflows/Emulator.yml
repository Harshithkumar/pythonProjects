name: Android Emulator with Appium

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      appium:
        image: appium/appium
        options: --entrypoint=sh -c 'appium'
        ports:
          - 4723:4723

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 30
        build-tools: 30.0.3
        target: default
        arch: x86_64
        profile: no

    - name: Install Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install appium-python-client pyyaml

    - name: Create AVD
      run: echo "no" | avdmanager create avd -n test -k "system-images;android-30;default;x86_64"

    - name: Start emulator
      run: |
        $ANDROID_SDK_ROOT/emulator/emulator-headless -avd test -no-audio -no-window &
        adb wait-for-device
        adb shell input keyevent 82

    - name: Wait for emulator to boot
      run: |
        adb wait-for-device
        sleep 30
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0

    - name: Run tests
      run: python your_script.py
