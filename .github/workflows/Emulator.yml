name: Android Emulator with Appium

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      appium:
        image: appium/appium:latest
        ports:
          - 4723:4723

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK environment variables
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/platform-tools:$HOME/android-sdk/emulator:$HOME/android-sdk/cmdline-tools/tools/bin:$HOME/android-sdk/tools/bin:$PATH" >> $GITHUB_ENV

    - name: Download command-line tools
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/tools

    - name: Accept licenses
      run: yes | $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager --licenses

    - name: Install Android SDK
      run: |
        $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager "platform-tools" "platforms;android-30" "system-images;android-30;default;x86_64" "emulator" "build-tools;30.0.3"

    - name: Install Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install appium-python-client pyyaml

    - name: List available devices
      run: $HOME/Library/Android/sdk/cmdline-tools/latest/bin/avdmanager list device

    - name: Create AVD
      run: |
       echo "no" | $HOME/android-sdk/cmdline-tools/tools/bin/avdmanager create avd -n test -k "system-images;android-30;default;x86_64" -c 100M --force
       $HOME/Library/Android/sdk/cmdline-tools/latest/bin/avdmanager list avd

    - name: Start emulator
      run: |
          $HOME/Library/Android/sdk/emulator/emulator -avd $AVD_NAME -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect -no-window -wipe-data &
          for i in {1..60}; do
            if adb devices | grep -q emulator; then
              echo "Emulator is ready"
              sleep 30
              adb devices # Display list of devices to get the UDID
              break
            fi
            echo "Waiting for emulator to start..."
            sleep 10
          done
          sleep 30 # Wait for 30 more seconds before checking emulator status
          for i in {1..6}; do
            if adb devices | grep -q "emulator-"; then
              echo "Emulator is online"
              break
            fi
            echo "Waiting for emulator to be online..."
            sleep 10
          done
          sleep 30 # Wait for 30 seconds before checking adb devices again
          adb devices # Display list of devices after additional wait

    - name: Restart ADB server
      run: adb kill-server && adb start-server

    - name: Check emulator status after ADB restart
      run: |
          sleep 30 # Give some time after restarting ADB server
          adb devices
          adb shell input keyevent 82

    - name: Wait for emulator to boot
      run: |
        adb wait-for-device
        sleep 60
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0

    - name: Run tests
      run: python your_script.py
      env:
        APPIUM_SERVER: http://localhost:4723/wd/hub
