name:
  Sanity Job
 
  # Controls when the workflow will run
on:
  # Triggers the workflow every 5 minutes
  # schedule:
  #   - cron: "*/1 * * * *"
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    # - name: Set HEADLESS environment variable (headless run)
    #   run: echo "HEADLESS=true" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.x
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
        pip --version
    
    - name: Install dependencies
      run: pip install -r requirement.txt

    # - name: Prepare Allure history # Step to prepare Allure history directory
    #   run: |
    #     cd ..
    #     mkdir -p ${{ vars.ALLURE_RESULTS_PATH }}

    - name: Run Pytest tests
      run: pytest --alluredir=Reports pytests/test_fixturesvalues.py

    - name: Generate allure-results
      uses: actions/upload-artifact@master
      with:
        name: allure-results
        path: Reports
        retention-days: 20
        
    - name: Get Allure history
      uses: actions/checkout@v2
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Test marketplace action
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: Reports
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20
        
    - name: Deploy Allure report to GitHub Pages # Step to deploy Allure report to GitHub Pages
      if: always() # Execute even if previous steps fail
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.ALONE_TOKEN }} # Provide the GitHub token for authentication
        publish_branch: gh-pages # Specify the branch to publish the report to
        publish_dir: allure-history # Specify the directory containing the report
