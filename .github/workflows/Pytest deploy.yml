name:
  Sanity Job
 
  # Controls when the workflow will run
on:
  # Triggers the workflow every 5 minutes
  # schedule:
  #   - cron: "*/1 * * * *"
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    # - name: Set HEADLESS environment variable (headless run)
    #   run: echo "HEADLESS=true" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.x
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
        pip --version
    
    - name: Install dependencies
      run: pip install -r requirement.txt

    # - name: Prepare Allure history # Step to prepare Allure history directory
    #   run: |
    #     cd ..
    #     mkdir -p ${{ vars.ALLURE_RESULTS_PATH }}

    - name: Run Pytest tests
      run: pytest --alluredir=allure-results pytests/test_fixturesvalues.py

    # - name: Generate allure-results
    #   uses: actions/upload-artifact@master
    #   with:
    #     name: allure-results
    #     path: Reports
    #     retention-days: 20
        
    - name: Get Allure history
      uses: actions/checkout@v3
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Allure Report action from marketplace
      uses: simple-elf/allure-report-action@v1.7
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history

    - name: Deploy report to Github Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v2
      env:
        PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_BRANCH: gh-pages
        PUBLISH_DIR: allure-history
